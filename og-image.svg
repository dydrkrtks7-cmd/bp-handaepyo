<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="828" cy="662" r="67" fill="#1565c0" opacity="0.19"/>
    <circle cx="577" cy="88" r="70" fill="#1565c0" opacity="0.14"/>
    <circle cx="1022" cy="587" r="40" fill="#1565c0" opacity="0.11"/>
    <circle cx="1158" cy="417" r="60" fill="#1565c0" opacity="0.16"/>
    <circle cx="724" cy="277" r="46" fill="#1565c0" opacity="0.17"/>
    <circle cx="1161" cy="634" r="63" fill="#1565c0" opacity="0.19"/>
    <rect x="600" y="652" width="70" height="53" rx="8" fill="#0d47a1" opacity="0.15" transform="rotate(23, 311, 597)"/>
    <rect x="1161" y="517" width="59" height="41" rx="8" fill="#0d47a1" opacity="0.10" transform="rotate(21, 466, 25)"/>
    <rect x="1261" y="-7" width="30" height="51" rx="8" fill="#0d47a1" opacity="0.07" transform="rotate(20, 236, 723)"/>
    <rect x="875" y="563" width="25" height="47" rx="8" fill="#0d47a1" opacity="0.04" transform="rotate(32, 532, 387)"/>
    <rect x="150" y="666" width="23" height="38" rx="8" fill="#0d47a1" opacity="0.13" transform="rotate(40, 363, -63)"/>
    <rect x="865" y="138" width="98" height="34" rx="8" fill="#0d47a1" opacity="0.05" transform="rotate(23, 1158, 716)"/>
    <rect x="725" y="522" width="42" height="89" rx="8" fill="#0d47a1" opacity="0.03" transform="rotate(3, 976, 445)"/>
    <rect x="573" y="73" width="50" height="60" rx="8" fill="#0d47a1" opacity="0.08" transform="rotate(6, 971, 565)"/>
    <polygon points="427,512 480,618 374,618" fill="#1565c0" opacity="0.06"/>
    <polygon points="1293,54 1324,116 1262,116" fill="#1565c0" opacity="0.07"/>
    <polygon points="741,509 790,607 692,607" fill="#1565c0" opacity="0.10"/>
    <polygon points="1235,369 1295,489 1175,489" fill="#1565c0" opacity="0.07"/>

  <!-- Wave at bottom -->
  <path d="M0,542 C360,586 840,498 1200,542 L1200,630 L0,630Z" fill="#1565c0" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포셔츠룸 한대표 예약센터
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 셔츠룸
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#00bcd4" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#00bcd4" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 마포셔츠룸 한대표 예약센터 — 셔츠룸
  </text>
</svg>